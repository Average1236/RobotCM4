syntax = "proto3";
import "zss_cmd_type.proto";
package ZSS.New;

message Robots_Status{
    repeated Robot_Status_Sim robots_status = 1;
}
enum Team{
    UNKNOWN = 0;
    BLUE = 1;
    YELLOW = 2;
}
// use to multicast in LAN
message Multicast_Status{
    sint32 ip = 1;
    string uuid = 2;
    Team team = 3;
    int32 robot_id = 4;
    // battery voltage
    sint32 battery = 5;
    // capacitance
    sint32 capacitance = 6;

    bool vision_valid = 7;
    sint32 infrared = 8;
    bool have_imu = 9;
}

message Robot_Status {
    int32 robot_id = 1;
    // infrared sensor with elasped time , positive means infrared is detected
    sint32 infrared = 2;
    // elasped time since last kick
    sint32 flat_kick = 3;
    // elasped time since last chip
    sint32 chip_kick = 4;
    // imu angle
    sint32 imu_theta_z = 5;
    // battery voltage
    sint32 battery = 6;
    // capacitance
    sint32 capacitance = 7;
    // wheel encoder value
    repeated sint32 wheel_encoder = 9;
    // team
    Team team = 10;
    bool have_imu = 13;
    sint32 imu_omega_z = 14;
    MotionFeedbackV2 motion_feedback = 50;
}

message Robot_Status_Sim {
    int32 robot_id = 1;
    // infrared sensor with elasped time , positive means infrared is detected
    float infrared = 2; // ms, -1
    // elasped time since last kick
    float flat_kick = 3; // max 10000ms
    // elasped time since last chip
    float chip_kick = 4; // max 10000ms
    // imu angle
    float imu_theta = 5;
    // battery voltage
    float battery = 6; // V
    // capacitance
    float capacitance = 7; // V
    // wheel encoder value
    repeated float wheel_encoder = 9;
    Team team = 10;
}

message Robots_Command {
    repeated Robot_Command command = 1;
    // delay * 0.1ms
    optional int32 delay = 2;
}

message Robot_Command {
    int32 robot_id = 1;
    enum KickMode { NONE = 0; KICK = 1; CHIP = 2; }
    KickMode kick_mode = 2;
    // Flat kick speed (m/s) or chip distance (m), calibrated by Athena.
    float desire_power = 3;
    MotionCommandV2 motion_command = 50;
    VisionObservationV2 vision_observation = 51;
}

message Robots_Command_Sim {
    repeated Robot_Command_Sim command = 1;
    // delay * 0.1ms
    optional int32 delay = 2;
}

enum SimCommandType {
    SIM_COMMAND_UNSPECIFIED = 0;
    SIM_COMMAND_VELOCITY = 2;
}
message Robot_Command_Sim {
    int32 robot_id = 1;
    Robot_Command.KickMode kick_mode = 2;
    float desire_power = 3;
    float dribble_spin = 5;
    // grSim requires the explicit velocity command discriminator.
    SimCommandType cmd_type = 7;
    CmdVel_Sim cmd_vel = 8;
}

// ===========================================================================
// Motion commands use SI units and monotonic microseconds. The CM4 bridge
// maps the producer clock onto its local clock.
// ===========================================================================
enum MotionTranslationMode {
    MOTION_TRANSLATION_STOP = 0;
    MOTION_TRANSLATION_POSE = 1;
    MOTION_TRANSLATION_GLOBAL_VELOCITY = 2;
    MOTION_TRANSLATION_BODY_VELOCITY = 3;
}
enum MotionYawMode {
    MOTION_YAW_HOLD = 0;
    MOTION_YAW_POSE = 1;
    MOTION_YAW_ANGULAR_VELOCITY = 2;
}
enum MotionLocalizationQuality {
    MOTION_LOCALIZATION_INVALID = 0;
    MOTION_LOCALIZATION_DEGRADED = 1;
    MOTION_LOCALIZATION_GOOD = 2;
}
enum MotionSafetyState {
    MOTION_SAFETY_INITIALIZING = 0;
    MOTION_SAFETY_READY = 1;
    MOTION_SAFETY_COMMAND_TIMEOUT = 2;
    MOTION_SAFETY_LOCALIZATION_BRAKE = 3;
    MOTION_SAFETY_LOCALIZATION_INVALID = 4;
    MOTION_SAFETY_FAULT = 5;
}

message MotionPose2 {
    float x = 1;
    float y = 2;
    float yaw = 3;
}
message MotionTwist2 {
    float vx = 1;
    float vy = 2;
    float wz = 3;
}
message MotionAccel2 {
    float ax = 1;
    float ay = 2;
    float alpha = 3;
}
message MotionLimitsV2 {
    float max_linear_speed_m_s = 1;
    float max_linear_accel_m_s2 = 2;
    float max_linear_decel_m_s2 = 3;
    float max_yaw_speed_rad_s = 4;
    float max_yaw_accel_rad_s2 = 5;
    float max_centripetal_accel_m_s2 = 6;
    float max_wheel_torque_nm = 7;
    float max_torque_rate_nm_per_s = 8;
    float position_correction_gain = 9;
    float position_correction_limit_m_s = 10;
    float yaw_correction_gain = 11;
    float yaw_rate_gain = 12;
    float wheel_speed_kp = 13;
    float wheel_speed_ki = 14;
    float wheel_speed_backcalc = 15;
}
message MotionCommandV2 {
    MotionTranslationMode translation_mode = 2;
    MotionYawMode yaw_mode = 3;
    uint32 session_id = 4;
    uint32 sequence = 5;
    uint32 trajectory_epoch = 6;
    uint64 generated_time_us = 7;
    uint32 valid_for_us = 8;
    MotionPose2 target_pose = 9;
    MotionTwist2 target_velocity = 10;
    MotionLimitsV2 limits = 11;
    bool enable = 12;
    bool kick_requested = 13;
    bool chip_mode = 14;
    uint32 kick_discharge_time_us = 15;
    uint32 kick_sequence = 16;
    uint32 kick_valid_for_us = 17;
    uint32 dribble_mode = 18;
    float dribble_power = 19;
    float dribble_velocity_rps = 20;
    float dribble_torque_ff_nm = 21;
}
message VisionObservationV2 {
    uint64 capture_time_us = 1;
    uint32 sequence = 2;
    MotionPose2 pose = 3;
    float position_std_m = 4;
    float yaw_std_rad = 5;
    MotionLocalizationQuality quality = 6;
    bool valid = 7;
}
message MotionFeedbackV2 {
    MotionSafetyState safety = 2;
    MotionLocalizationQuality localization = 3;
    uint32 session_id = 4;
    uint32 executed_sequence = 5;
    uint32 trajectory_epoch = 6;
    uint32 active_command_age_us = 7;
    uint64 fusion_time_us = 8;
    uint64 prediction_time_us = 9;
    uint64 feedback_time_us = 10;
    uint64 vision_capture_time_us = 11;
    uint32 vision_age_us = 12;
    MotionPose2 estimated_pose = 13;
    MotionTwist2 estimated_velocity = 14;
    float position_sigma_m = 15;
    float yaw_sigma_rad = 16;
    MotionPose2 reference_pose = 17;
    MotionTwist2 reference_velocity = 18;
    MotionAccel2 reference_accel = 19;
    bool trajectory_active = 20;
    float gyro_bias_z_rad_s = 21;
    float accel_bias_x_m_s2 = 22;
    float accel_bias_y_m_s2 = 23;
    repeated float wheel_speed_target = 24;
    repeated float wheel_speed_measured = 25;
    repeated float feedforward_torque = 26;
    repeated float feedback_torque = 27;
    repeated float integral_torque = 28;
    repeated float applied_torque = 29;
    uint32 saturation = 30;
    bool wheel_speed_enabled = 31;
    bool vision_fused = 32;
    bool accelerometer_degraded = 33;
    bool wheel_slip_suspected = 34;
    uint32 late_observations = 35;
    uint32 rejected_observations = 36;
    uint32 vision_updates = 37;
    uint32 estimator_version = 38;
    uint32 controller_version = 39;
    uint32 model_version = 40;
    uint32 protocol_version = 41;
}
message MotionConfigV2 {
    float mass_kg = 1;
    float inertia_kg_m2 = 2;
    float wheel_radius_m = 3;
    float wheel_center_distance_m = 4;
    float wheel_inertia_kg_m2 = 5;
    float wheel_friction_torque_nm = 6;
    float wheel_viscous_nm_per_rad_s = 7;
    float efficiency = 8;
    float max_wheel_torque_nm = 9;
    float max_wheel_speed_rad_s = 10;
    float max_wheel_accel_rad_s2 = 11;
    float torque_rate_nm_per_s = 12;
    repeated float wheel_axis_angle_rad = 13;
    repeated float wheel_yaw_sign = 14;
    MotionLimitsV2 limits = 15;
    float fusion_delay_s = 16;
    float history_span_s = 17;
    float command_timeout_s = 18;
    float spi_timeout_s = 19;
    float vision_degrade_s = 20;
    float vision_invalid_s = 21;
    uint32 config_version = 22;
}
