syntax = "proto3";
package ZSS.New;

message CmdVel_Sim {
    // velocity in m/s
    float velocity_x = 1;
    float velocity_y = 2;
    // if use_imu is false, than use velocity_r
    // if use_imu is true, than use imu_theta (need calibrate)
    bool use_imu = 3;
    // use_imu == false
    float velocity_r = 4;
    // use_imu == true
    float imu_theta = 5;
}
